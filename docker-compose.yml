name: finances

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finances_backend
    restart: always
    env_file: .env
    environment:
      DOCKER_BUILDKIT: 1
    volumes:
      - static_files:/app/staticfiles
    networks:
      - finances_network
    command: >
      sh -c "uv run --frozen --no-sync python manage.py migrate &&
             uv run --frozen --no-sync python manage.py collectstatic --noinput &&
             uv run --frozen --no-sync gunicorn finances.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/login/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finances_frontend
    restart: always
    ports:
      - "${FINANCES_PORT:-80}:80"
    volumes:
      - static_files:/app/staticfiles:ro
    networks:
      - finances_network
    depends_on:
      backend:
        condition: service_healthy

volumes:
  static_files:

networks:
  finances_network:
    name: finances_network