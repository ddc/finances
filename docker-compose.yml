name: finances

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - PYTHON_IMAGE=${PYTHON_IMAGE:-python:3.14.7-alpine3.24}
        - LOG_DIRECTORY=${LOG_DIRECTORY}
    container_name: finances_backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    env_file: .env
    environment:
      DOCKER_BUILDKIT: 1
    volumes:
      - static_files:/app/staticfiles
      - ./backend/logs:/app/logs
    networks:
      - postgres_network
    command:
      - sh
      - -c
      - |
        uv run --frozen --no-sync python manage.py migrate &&
        uv run --frozen --no-sync python manage.py shell -c "from rest_framework.authtoken.models import Token; Token.objects.all().delete(); print('All auth tokens cleared')" &&
        uv run --frozen --no-sync python manage.py seed_data &&
        uv run --frozen --no-sync python manage.py collectstatic --noinput &&
        uv run --frozen --no-sync gunicorn finances.wsgi:application --bind 0.0.0.0:8000 --workers 2
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null localhost:8000/admin/login/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BUN_IMAGE=${BUN_IMAGE:-oven/bun:1.3.14-alpine}
        - NGINX_IMAGE=${NGINX_IMAGE:-nginx:1.31.3-alpine3.24-slim}
        - LOG_DIRECTORY=${LOG_DIRECTORY}
    container_name: finances_frontend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    env_file: .env
    ports:
      - "${FRONTEND_PORT:-443}:8443"
    volumes:
      - static_files:/app/staticfiles:ro
      - ./certs:/etc/nginx/certs:ro
      - ./frontend/logs:/app/logs
    networks:
      - postgres_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://127.0.0.1:8443/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  static_files:

networks:
  postgres_network:
    name: postgres_network
    external: true
