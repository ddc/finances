sonar.projectKey=ddc_finances
sonar.organization=ddc

sonar.sources=backend,frontend/src
sonar.tests=backend/tests,frontend/src/test

sonar.python.version=3.14
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.xunit.reportPath=backend/junit.xml

sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.exclusions=\
  backend/core/migrations/**/*,\
  backend/core/management/**/*,\
  frontend/dist/**/*,\
  **/node_modules/**/*

sonar.security.exclusions=\
  backend/tests/**/*,\
  frontend/src/test/**/*

sonar.coverage.exclusions=\
  backend/tests/**/*,\
  backend/core/migrations/**/*,\
  frontend/src/test/**/*

sonar.cpd.exclusions=\
  frontend/src/i18n/**/*,\
  frontend/src/pages/**/*
