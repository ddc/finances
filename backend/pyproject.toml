[project]
name = "finances"
version = "1.0.23"
description = "Personal finance management app"
license = { text = "MIT" }
readme = "README.md"
authors = [
  { name = "Daniel Costa", email = "daniel@ddcsoftwares.com" },
]
requires-python = ">=3.14.7"
dependencies = [
  "django>=6.1",
  "djangorestframework>=3.18.0",
  "gunicorn>=26.0.0",
  "psycopg2-binary>=2.9.12",
  "pydantic_settings>=2.15.0",
  "pythonLogs>=7.0.1",
  "requests>=2.34.2",
  "uuid-utils>=0.17.0",
]

[dependency-groups]
dev = [
  "coverage>=7.15.4",
  "poethepoet>=0.48.0",
  "pytest-django>=4.14.0",
  "ruff>=0.16.3",
  "testcontainers[postgres]>=4.15.0",
]

[tool.poe.tasks]
# --- Backend ---
linter-backend.shell = "uv run ruff check --fix . && uv run ruff format ."
profile-backend = "uv run python -m cProfile -o cprofile_unit.prof -m pytest tests/unit"
profile-backend-integration = "uv run python -m cProfile -o cprofile_integration.prof -m pytest tests/integration"
test-backend-unit.sequence = [
  { shell = "uv run coverage erase" },
  { shell = "uv run coverage run --append -m pytest tests/unit" },
  { shell = "uv run coverage report" },
  { shell = "mkdir -p ../coverage-reports && uv run coverage xml" },
]
test-backend-integration.sequence = [
  { shell = "uv run coverage run --append -m pytest tests/integration" },
  { shell = "uv run coverage report" },
]
test-backend-docker = "uv run pytest tests/docker"
hadolint-backend.shell = "docker run --rm -i -v $(pwd)/../.hadolint.yml:/.config/hadolint.yml:ro hadolint/hadolint < Dockerfile"
update-backend.shell = "uv lock --upgrade && uv sync --all-extras --all-groups"
migration-backend = "uv run --frozen python manage.py migrate"
# --- Frontend ---
linter-frontend.shell = "cd ../frontend && bun run lint"
test-frontend.shell = "cd ../frontend && bunx vitest run tests/unit --coverage"
test-frontend-integration.shell = "cd ../frontend && bunx vitest run tests/integration"
sync-version.shell = "python3 -c \"import tomllib,json,pathlib; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; p=pathlib.Path('../frontend/package.json'); d=json.loads(p.read_text()); d['version']=v; p.write_text(json.dumps(d,indent=2)+'\\n'); print('Synced version: '+v)\""
update-frontend.shell = "cd ../frontend && bun update && bun run build"
# --- All ---
linter.sequence = ["linter-backend", "linter-frontend"]
updatedev.sequence = ["update-backend", "sync-version", "update-frontend"]
tests.sequence = [
  "linter-backend", "linter-frontend", "hadolint-backend", "test-backend-docker",
  { shell = "uv run coverage erase" },
  { shell = "uv run coverage run --append -m pytest tests/unit" },
  { shell = "uv run coverage run --append -m pytest tests/integration" },
  { shell = "uv run coverage report" },
  { shell = "mkdir -p ../coverage-reports && uv run coverage xml" },
  "test-frontend", "test-frontend-integration",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.unit.test_settings"
addopts = "-v --import-mode=importlib --junitxml=junit.xml"
junit_family = "legacy"
markers = [
  "integration: marks tests as integration tests",
  "docker: Docker and compose file tests",
]

[tool.coverage.run]
relative_files = true
omit = [
  "tests/*",
  "*/__init__.py"
]

[tool.coverage.xml]
output = "../coverage-reports/coverage-python.xml"

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "SLF"]
ignore = ["E501", "E402", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"finances/settings.py" = ["S105"]
"tests/**/*.py" = ["S101", "S105", "S106", "S110", "S311", "S603", "S607", "SLF001", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["finances", "core"]
no-lines-before = ["future", "standard-library", "third-party", "first-party", "local-folder"]
no-sections = true
