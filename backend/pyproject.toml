[project]
name = "finances"
version = "1.0.0"
description = "Personal finance management app"
license = { text = "MIT" }
readme = "README.md"
authors = [
  { name = "Daniel Costa", email = "daniel@ddcsoftwares.com" },
]
requires-python = ">=3.14"
dependencies = [
  "django>=6.0.3",
  "djangorestframework>=3.17.1",
  "gunicorn>=25.3.0",
  "psycopg2-binary>=2.9.11",
  "pydantic_settings>=2.13.1",
  "pythonLogs>=7.0.1",
  "requests>=2.33.1",
  "uuid-utils>=0.14.1",
]

[dependency-groups]
dev = [
  "coverage>=7.13.5",
  "poethepoet>=0.42.1",
  "pytest>=9.0.2",
  "pytest-django>=4.12.0",
  "ruff>=0.15.9",
  "testcontainers[postgres]>=4.14.2",
]

[tool.poe.tasks]
# --- Backend ---
linter-backend.shell = "uv run ruff check --fix . && uv run ruff format ."
profile-backend = "uv run python -m cProfile -o cprofile_unit.prof -m pytest tests/unit"
profile-backend-integration = "uv run python -m cProfile -o cprofile_integration.prof -m pytest tests/integration"
test-backend.shell = "uv run coverage run -m pytest tests/unit && uv run coverage report && uv run coverage xml"
test-backend-integration = "uv run pytest tests/integration"
test-backend-docker = "uv run pytest tests/docker"
hadolint-backend.shell = "docker run --rm -i -v $(pwd)/../.hadolint.yml:/.config/hadolint.yml:ro hadolint/hadolint < Dockerfile"
update-backend.shell = "uv run ruff check --fix . && uv run ruff format . && uv lock --upgrade && uv sync --all-extras --all-groups"
migration-backend = "uv run --frozen python manage.py migrate"
# --- Frontend ---
linter-frontend.shell = "cd ../frontend && npm run lint"
test-frontend.shell = "cd ../frontend && npx vitest run src/test/unit"
test-frontend-integration.shell = "cd ../frontend && npx vitest run src/test/integration"
update-frontend.shell = "cd ../frontend && npm update && npm run build"
# --- All ---
linter.sequence = ["linter-backend", "linter-frontend"]
updatedev.sequence = ["update-backend", "update-frontend"]
tests.sequence = ["linter-backend", "linter-frontend", "hadolint-backend", "test-backend-docker", "test-backend", "test-backend-integration", "test-frontend", "test-frontend-integration"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "finances.test_settings"
addopts = "-v --import-mode=importlib --junitxml=junit.xml"
junit_family = "legacy"
markers = [
  "integration: marks tests as integration tests",
  "docker: Docker and compose file tests",
]

[tool.coverage.run]
omit = [
  "tests/*",
  "*/__init__.py"
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "SLF"]
ignore = ["E501", "E402", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"finances/settings.py" = ["S105"]
"tests/**/*.py" = ["S101", "S105", "S106", "S110", "S311", "S603", "S607", "SLF001", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["finances", "core"]
no-lines-before = ["future", "standard-library", "third-party", "first-party", "local-folder"]
no-sections = true
