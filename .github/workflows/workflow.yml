name: CI/CD Pipeline

'on':
  pull_request:
  push:
    tags: ['v*']

env:
  LATEST_PYTHON_VERSION: '3.14'
  LATEST_NODE_VERSION: '22'

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@v3
        with:
          src: "./backend"
          args: "check"

  test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ env.LATEST_PYTHON_VERSION }}
        run: uv python install ${{ env.LATEST_PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups

      - name: Run tests with coverage
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 2
          max_attempts: 3
          command: cd backend && uv run --no-sync coverage run -m pytest tests/unit && uv run --no-sync coverage report && uv run --no-sync coverage xml
          shell: bash

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v5
        with:
          report_type: test_results

  integration-test:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ env.LATEST_PYTHON_VERSION }}
        run: uv python install ${{ env.LATEST_PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups

      - name: Run integration tests
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 3
          max_attempts: 3
          command: cd backend && uv run --no-sync pytest tests/integration
          shell: bash

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node ${{ env.LATEST_NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.LATEST_NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          config: .hadolint.yml

      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet

      - name: Build backend base image
        run: docker build --target python-base -t finances-ci-test ./backend

      - name: Smoke test - Python available
        run: |
          VERSION=$(docker run --rm finances-ci-test python --version)
          echo "$VERSION"
          echo "$VERSION" | grep -q "${{ env.LATEST_PYTHON_VERSION }}"

      - name: Smoke test - uv available
        run: docker run --rm finances-ci-test uv --version

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [test, integration-test, frontend-test, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
