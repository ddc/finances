name: CI/CD Pipeline

'on':
  pull_request:
  push:
    tags: ['v*']

env:
  LATEST_PYTHON_VERSION: '3.14'

jobs:
  lint-backend:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/ruff-action@v3
        with:
          src: "./backend"
          args: "check"

  lint-frontend:
    name: Frontend Lint (eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  test-backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: lint-backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ env.LATEST_PYTHON_VERSION }}
        run: uv python install ${{ env.LATEST_PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups

      - name: Run tests with coverage
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 2
          max_attempts: 3
          command: cd backend && uv run --no-sync coverage run -m pytest tests/unit && uv run --no-sync coverage report && mkdir -p coverage-reports && uv run --no-sync coverage xml -o coverage-reports/coverage.xml
          shell: bash

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v5
        with:
          report_type: test_results

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: backend-coverage
          path: backend/coverage-reports/coverage.xml

  test-frontend:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: lint-frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests with coverage
        run: bunx vitest run src/test/unit --coverage

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: frontend-coverage
          path: frontend/coverage-reports/lcov.info

  test-backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: lint-backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ env.LATEST_PYTHON_VERSION }}
        run: uv python install ${{ env.LATEST_PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups

      - name: Run integration tests
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 3
          max_attempts: 3
          command: cd backend && uv run --no-sync pytest tests/integration
          shell: bash

  test-frontend-integration:
    name: Frontend Integration Tests
    runs-on: ubuntu-latest
    needs: lint-frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run integration tests
        run: bunx vitest run src/test/integration

  docker-backend:
    name: Backend Docker
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          config: .hadolint.yml

      - name: Build base image
        run: docker build --target python-base -t finances-backend-ci ./backend

      - name: Smoke test - Python available
        run: |
          VERSION=$(docker run --rm finances-backend-ci python --version)
          echo "$VERSION"
          echo "$VERSION" | grep -q "${{ env.LATEST_PYTHON_VERSION }}"

      - name: Smoke test - uv available
        run: docker run --rm finances-backend-ci uv --version

  docker-frontend:
    name: Frontend Docker
    runs-on: ubuntu-latest
    needs: lint-frontend
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          config: .hadolint.yml

      - name: Build image
        run: docker build -t finances-frontend-ci ./frontend

      - name: Smoke test - nginx config exists
        run: docker run --rm finances-frontend-ci cat /etc/nginx/conf.d/default.conf | grep -q "upstream backend"

  docker-compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    needs: [docker-backend, docker-frontend]
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet

  sonarcloud:
    name: SonarCloud Code Analysis
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v8.0.1
        with:
          name: backend-coverage
          path: coverage-reports

      - name: Download frontend coverage
        uses: actions/download-artifact@v8.0.1
        with:
          name: frontend-coverage
          path: coverage-reports

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [test-frontend, test-frontend-integration]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [test-backend, test-backend-integration, test-frontend, test-frontend-integration, build-frontend, docker-compose]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
