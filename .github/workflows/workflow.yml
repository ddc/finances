name: CI/CD Pipeline

'on':
  pull_request:
  push:
    tags: ['v*']

env:
  LATEST_PYTHON_VERSION: '3.14'

jobs:
  lint-backend:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3
        with:
          src: "./backend"
          args: "check"

  lint-frontend:
    name: Frontend Lint (eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  sonarcloud:
    name: SonarCloud Test and Code Analysis
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python ${{ env.LATEST_PYTHON_VERSION }}
        run: uv python install ${{ env.LATEST_PYTHON_VERSION }}

      - name: Install backend dependencies
        run: cd backend && uv sync --locked --all-extras --all-groups

      - name: Run backend tests with coverage
        working-directory: backend
        run: |
          mkdir -p ../coverage-reports
          uv run --no-sync coverage run -m pytest tests/unit
          uv run --no-sync coverage report
          uv run --no-sync coverage xml
          sed -i 's|<source>.*</source>|<source>backend</source>|' ../coverage-reports/coverage-python.xml

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install frontend dependencies
        run: cd frontend && bun install --frozen-lockfile

      - name: Run frontend tests with coverage
        run: cd frontend && bunx vitest run src/test/unit src/test/integration --coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  test-backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: lint-backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python ${{ env.LATEST_PYTHON_VERSION }}
        run: uv python install ${{ env.LATEST_PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups

      - name: Run integration tests
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 3
          max_attempts: 3
          command: cd backend && uv run --no-sync pytest tests/integration
          shell: bash

  test-frontend-integration:
    name: Frontend Integration Tests
    runs-on: ubuntu-latest
    needs: lint-frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run integration tests
        run: bunx vitest run src/test/integration

  docker-backend:
    name: Backend Docker
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: backend/Dockerfile
          config: .hadolint.yml

      - name: Build base image
        run: docker build --target python-base -t finances-backend-ci ./backend

      - name: Smoke test - Python available
        run: |
          VERSION=$(docker run --rm finances-backend-ci python --version)
          echo "$VERSION"
          echo "$VERSION" | grep -q "${{ env.LATEST_PYTHON_VERSION }}"

      - name: Smoke test - uv available
        run: docker run --rm finances-backend-ci uv --version

  docker-frontend:
    name: Frontend Docker
    runs-on: ubuntu-latest
    needs: lint-frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          config: .hadolint.yml

      - name: Build image
        run: docker build -t finances-frontend-ci ./frontend

      - name: Smoke test - nginx config exists
        run: docker run --rm finances-frontend-ci cat /etc/nginx/conf.d/default.conf | grep -q "upstream backend"

  docker-compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    needs: [docker-backend, docker-frontend]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet

  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [sonarcloud, test-frontend-integration]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [sonarcloud, test-backend-integration, test-frontend-integration, build-frontend, docker-compose]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
