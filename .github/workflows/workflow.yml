name: CI/CD Pipeline

'on':
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

env:
  LATEST_PYTHON_VERSION: '3.14'

jobs:
  backend-lint:
    name: Backend Lint (ruff)
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          src: "./backend"
          args: "check"

  backend-integration-test:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python ${{ env.LATEST_PYTHON_VERSION }}
        run: uv python install ${{ env.LATEST_PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups

      - name: Run integration tests
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 3
          max_attempts: 3
          command: cd backend && uv run --no-sync pytest tests/integration
          shell: bash

  backend-docker-test:
    name: Backend Docker Test
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: backend/Dockerfile
          config: .hadolint.yml

      - name: Build base image
        run: docker build --target python-base -t finances-backend-ci ./backend

      - name: Smoke test - Python available
        run: |
          VERSION=$(docker run --rm finances-backend-ci python --version)
          echo "$VERSION"
          echo "$VERSION" | grep -q "${{ env.LATEST_PYTHON_VERSION }}"

      - name: Smoke test - uv available
        run: docker run --rm finances-backend-ci uv --version


  frontend-lint:
    name: Frontend Lint (eslint)
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  frontend-integration-test:
    name: Frontend Integration Tests
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run integration tests
        run: bunx vitest run tests/integration

  frontend-docker-test:
    name: Frontend Docker Test
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: frontend/Dockerfile
          config: .hadolint.yml

      - name: Build image
        run: docker build -t finances-frontend-ci ./frontend

      - name: Smoke test - nginx config exists
        run: docker run --rm finances-frontend-ci cat /etc/nginx/conf.d/default.conf | grep -q "upstream backend"

  frontend-build-test:
    name: Frontend Build Test
    runs-on: ubuntu-latest
    needs: [unit-test, frontend-integration-test]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build


  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-lint]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python ${{ env.LATEST_PYTHON_VERSION }}
        run: uv python install ${{ env.LATEST_PYTHON_VERSION }}

      - name: Install backend dependencies
        run: cd backend && uv sync --locked --all-extras --all-groups

      - name: Run backend tests with coverage
        working-directory: backend
        run: |
          mkdir -p ../coverage-reports
          uv run --no-sync coverage run -m pytest tests/unit
          uv run --no-sync coverage report
          uv run --no-sync coverage xml
          sed -i 's|<source>.*</source>|<source>backend</source>|' ../coverage-reports/coverage-python.xml

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: cd frontend && bun install --frozen-lockfile

      - name: Run frontend tests with coverage
        run: cd frontend && bunx vitest run tests/unit tests/integration --coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-compose-test:
    name: Docker Compose Test
    runs-on: ubuntu-latest
    needs: [backend-docker-test, frontend-docker-test]
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
