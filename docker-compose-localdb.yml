name: finances-local-db

services:
  finances_database:
    image: postgres:latest
    container_name: finances_database
    hostname: postgres
    restart: always
    env_file: .env
    environment:
      TZ: UTC
      POSTGRES_USER: ${POSTGRES_USER}
      PGUSER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - finances_database_data:/var/lib/postgresql:rw
    networks:
      - finances_network
    command: >
      bash -c "
        docker-entrypoint.sh postgres &
        until pg_isready -U ${POSTGRES_USER} -h localhost; do sleep 1; done;
        PGPASSWORD=${POSTGRES_PASSWORD} psql -U ${POSTGRES_USER} -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname = '${POSTGRES_DB}'\" | grep -q 1 || PGPASSWORD=${POSTGRES_PASSWORD} psql -U ${POSTGRES_USER} -d postgres -c \"CREATE DATABASE ${POSTGRES_DB}\";
        wait
      "
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  finances_migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finances_migrate
    restart: always
    env_file: .env
    environment:
      DOCKER_BUILDKIT: 1
      LOG_DIRECTORY: /app/logs
    networks:
      - finances_network
    depends_on:
      finances_database:
        condition: service_healthy
    command: ["sh", "-c", "uv run --frozen --no-sync python manage.py migrate && uv run --frozen --no-sync python manage.py seed_data && touch /tmp/migrate_done && sleep infinity"]
    deploy:
      restart_policy:
        delay: 60s
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /tmp/migrate_done"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 120s

volumes:
  finances_database_data:
    name: "finances_database_data"

networks:
  finances_network:
    name: finances_network
